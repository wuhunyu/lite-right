<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="LiteRight app icon, right click mouse with floating context menu">
  <title>LiteRight</title>
  <desc>Hand-drawn vector reconstruction of the approved pastel blue and peach glossy macOS icon. All art is vector paths and gradients; no bitmap images or fonts.</desc>
  <defs>
    <linearGradient id="tileBase" x1="0.02" y1="0.02" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#d8efff"/><stop offset="0.29" stop-color="#8cbaf6"/>
      <stop offset="0.59" stop-color="#8fa8d3"/><stop offset="0.79" stop-color="#f4c1aa"/><stop offset="1" stop-color="#ffe2be"/>
    </linearGradient>
    <radialGradient id="leftBlue" cx="0.26" cy="0.49" r="0.72">
      <stop offset="0" stop-color="#357ad6" stop-opacity="0.82"/>
      <stop offset="0.54" stop-color="#6c9cdb" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#eaf5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightPeach" cx="0.92" cy="0.75" r="0.67">
      <stop offset="0" stop-color="#ffc18c" stop-opacity="0.94"/>
      <stop offset="0.43" stop-color="#e8a994" stop-opacity="0.73"/>
      <stop offset="1" stop-color="#ffece0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topGlass" cx="0.66" cy="0.02" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.37" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveBlue" x1="0.04" y1="0.26" x2="0.97" y2="1">
      <stop offset="0" stop-color="#c5eaff" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#6793c9" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fdcbb8" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="waveWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d2c6" stop-opacity="0.02"/>
      <stop offset="0.55" stop-color="#f7ae81" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff0d6" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecf7ff"/>
      <stop offset="0.42" stop-color="#e9f4fe" stop-opacity="0.6"/>
      <stop offset="0.73" stop-color="#ffffff" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#ffe4ca"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1="0.15" y1="0.09" x2="0.85" y2="0.97">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.33" stop-color="#f9fbff"/>
      <stop offset="0.68" stop-color="#dce2f0"/><stop offset="1" stop-color="#b8b0c1"/>
    </linearGradient>
    <linearGradient id="mouseLeft" x1="0.04" y1="0.04" x2="0.94" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.54" stop-color="#fcfcfd"/>
      <stop offset="1" stop-color="#d9e0ec"/>
    </linearGradient>
    <linearGradient id="mouseRight" x1="0.05" y1="0.02" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff4c3"/><stop offset="0.36" stop-color="#ffd58b"/>
      <stop offset="0.78" stop-color="#f8b060"/><stop offset="1" stop-color="#ec9455"/>
    </linearGradient>
    <linearGradient id="mouseScroll" x1="0" y1="0" x2="1" y2="0.18">
      <stop offset="0" stop-color="#737184"/><stop offset="0.21" stop-color="#c6c4cd"/>
      <stop offset="0.5" stop-color="#f7f9fd"/><stop offset="0.85" stop-color="#a7a7bb"/><stop offset="1" stop-color="#656478"/>
    </linearGradient>
    <linearGradient id="menuFill" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffdf7"/><stop offset="0.47" stop-color="#f8f6f8"/>
      <stop offset="1" stop-color="#e8e4ec"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8992a6"/><stop offset="1" stop-color="#b7b5bf"/>
    </linearGradient>
    <radialGradient id="dotBlue" cx="0.2" cy="0.14" r="1">
      <stop offset="0" stop-color="#89ccff"/><stop offset="0.7" stop-color="#4b98ef"/><stop offset="1" stop-color="#3978d7"/>
    </radialGradient>
    <radialGradient id="dotOrange" cx="0.22" cy="0.18" r="1">
      <stop offset="0" stop-color="#ffd977"/><stop offset="0.75" stop-color="#ffb44f"/><stop offset="1" stop-color="#ee9652"/>
    </radialGradient>
    <linearGradient id="dotSilver" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#e4e7ef"/><stop offset="1" stop-color="#a5a9bb"/>
    </linearGradient>
    <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset in="blur" dx="0" dy="14" result="offset"/>
      <feComponentTransfer in="offset" result="fade"><feFuncA type="linear" slope="0.24"/></feComponentTransfer>
      <feMerge><feMergeNode in="fade"/></feMerge>
    </filter>
    <filter id="mouseShadow" x="-35%" y="-30%" width="170%" height="175%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feOffset in="blur" dx="10" dy="24" result="offset"/>
      <feComponentTransfer in="offset" result="fade"><feFuncA type="linear" slope="0.34"/></feComponentTransfer>
      <feMerge><feMergeNode in="fade"/></feMerge>
    </filter>
    <filter id="menuShadow" x="-35%" y="-35%" width="170%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="blur"/>
      <feOffset in="blur" dx="8" dy="19" result="offset"/>
      <feComponentTransfer in="offset" result="fade"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode in="fade"/></feMerge>
    </filter>
    <clipPath id="tileClip"><rect x="78" y="77" width="868" height="868" rx="196"/></clipPath>
  </defs>

  <!-- A transparent canvas outside the macOS rounded-square symbol. -->
  <g clip-path="url(#tileClip)">
    <rect x="78" y="77" width="868" height="868" fill="url(#tileBase)"/>
    <rect x="78" y="77" width="868" height="868" fill="url(#leftBlue)"/>
    <rect x="78" y="77" width="868" height="868" fill="url(#rightPeach)"/>
    <path d="M78 312 C190 511 288 311 493 235 C704 151 767 155 946 346 L946 77 L78 77 Z" fill="url(#topGlass)" opacity="0.65"/>
    <path d="M78 449 C275 580 427 659 554 812 C620 891 653 913 700 945 L78 945 Z" fill="url(#waveBlue)" opacity="0.86"/>
    <path d="M452 945 C683 741 831 724 946 824 L946 945 Z" fill="url(#waveWarm)" opacity="0.88"/>
    <path d="M533 77 C712 139 813 289 946 452 L946 77 Z" fill="#fff7ea" opacity="0.16"/>
    <path d="M78 453 C225 562 332 604 423 682" fill="none" stroke="#edfaff" stroke-width="1.8" stroke-opacity="0.6"/>
    <path d="M561 612 C728 584 826 697 946 781" fill="none" stroke="#ffe1c5" stroke-width="2" stroke-opacity="0.45"/>
  </g>
  <rect x="80.5" y="79.5" width="863" height="863" rx="193.5" fill="none" stroke="url(#rim)" stroke-width="6" opacity="0.96"/>
  <rect x="88" y="86" width="848" height="850" rx="187" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Main mouse silhouette and clear highlighted right mouse button. -->
  <path d="M502 200 C387 200 296 282 296 391 L296 600 C296 744 362 810 498 810 C635 810 695 731 695 597 L695 393 C695 283 621 200 502 200 Z" fill="#2a3a60" filter="url(#mouseShadow)" opacity="0.58"/>
  <path d="M502 198 C387 198 297 281 297 392 L297 596 C297 738 361 805 500 805 C636 805 692 730 692 598 L692 394 C692 286 621 198 502 198 Z" fill="url(#mouseBody)" stroke="#fff6e9" stroke-width="10"/>
  <path d="M501 207 C401 207 320 275 319 383 L319 471 C320 500 356 508 406 511 C454 514 493 512 493 481 L493 412 C485 405 477 392 477 381 L477 315 C477 301 486 290 494 288 L494 210 Z" fill="url(#mouseLeft)" stroke="#f5f7ff" stroke-width="5"/>
  <path d="M510 208 C608 210 673 279 681 389 L681 471 C680 494 663 499 638 504 C587 514 523 516 513 489 L513 411 C529 404 535 391 535 379 L535 313 C535 298 526 288 511 287 Z" fill="url(#mouseRight)" stroke="#fff0cd" stroke-width="6"/>
  <path d="M307 465 C311 508 389 531 475 517" fill="none" stroke="#b8c8de" stroke-width="5" stroke-opacity="0.68"/>
  <path d="M519 517 C576 527 659 518 681 488" fill="none" stroke="#efaa67" stroke-width="4" stroke-opacity="0.85"/>
  <path d="M324 536 C324 684 375 775 478 782" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.47"/>
  <path d="M313 383 C311 306 367 236 444 219" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M524 213 C583 221 645 266 670 326" fill="none" stroke="#fffbea" stroke-width="6" stroke-linecap="round" stroke-opacity="0.58"/>
  <rect x="473" y="284" width="63" height="140" rx="29" fill="#3b3446" opacity="0.23"/>
  <rect x="479" y="287" width="54" height="133" rx="27" fill="#535263" stroke="#ffffff" stroke-width="6"/>
  <rect x="486" y="294" width="40" height="120" rx="20" fill="url(#mouseScroll)"/>
  <path d="M494 303 C491 343 491 371 494 395" fill="none" stroke="#f9faff" stroke-opacity="0.65" stroke-width="5" stroke-linecap="round"/>

  <!-- Floating context menu: distinct rows, no text. -->
  <path d="M675 296 H842 Q880 296 880 334 V484 Q880 532 836 532 H674 Q632 532 632 490 V404 L606 377 Q598 369 606 362 L632 337 Q633 296 675 296 Z" fill="#28374c" filter="url(#menuShadow)" opacity="0.55"/>
  <path d="M674 296 H840 Q877 296 877 334 V480 Q877 526 837 526 H676 Q635 526 635 486 V402 L608 376 Q601 370 608 364 L635 337 Q635 296 674 296 Z" fill="url(#menuFill)" stroke="#ffffff" stroke-width="7"/>
  <path d="M649 349 Q651 309 689 309 H829" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="4" stroke-linecap="round"/>
  <circle cx="691" cy="354" r="21.5" fill="url(#dotOrange)" stroke="#fffefd" stroke-width="2.5"/>
  <circle cx="691" cy="416" r="21.5" fill="url(#dotBlue)" stroke="#fffefd" stroke-width="2.5"/>
  <circle cx="691" cy="478" r="21.5" fill="url(#dotSilver)" stroke="#fffefd" stroke-width="2.5"/>
  <rect x="731" y="340" width="109" height="22" rx="11" fill="url(#barFill)" opacity="0.91"/>
  <rect x="731" y="403" width="109" height="22" rx="11" fill="url(#barFill)" opacity="0.91"/>
  <rect x="731" y="466" width="109" height="22" rx="11" fill="url(#barFill)" opacity="0.91"/>
</svg>
