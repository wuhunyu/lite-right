name: LiteRight v1.0.0 community release (unnotarized)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-v1:
    if: contains(github.event.head_commit.message, '[publish-v1.0.0]')
    name: Build, tag and publish LiteRight v1.0.0
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard the exact main commit and release uniqueness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git ls-remote --tags origin refs/tags/v1.0.0)"
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'ERROR: v1.0.0 release already exists' >&2
            exit 1
          fi
          grep -Fq 'LITERIGHT_RELEASE_CHANNEL: preview' project.yml
          grep -Fq 'LiteRightReleaseChannel: "$(LITERIGHT_RELEASE_CHANNEL)"' project.yml
      - name: Toolchain, real filesystem tests and generated metadata
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          brew install xcodegen
          swift test --package-path LiteRightCore
          bash ci/test-finder-sync-diagnostics.sh
          python3 -m venv .icon-venv
          .icon-venv/bin/python -m pip install --disable-pip-version-check pillow cairosvg
          .icon-venv/bin/python tools/export-icons.py
          xcodegen generate
          swift ci/verify-xcodegen-metadata.swift
      - name: Build ARM64 v1.0.0 with release metadata and ad-hoc URL transport
        run: |
          set -euo pipefail
          xcodebuild -project LiteRight.xcodeproj -scheme LiteRight \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/LiteRightReleaseDerived" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=1 \
            LITERIGHT_RELEASE_CHANNEL=release \
            OTHER_SWIFT_FLAGS="-D LITERIGHT_UNTRUSTED_PREVIEW" \
            build 2>&1 | tee release-build.log
          APP="$RUNNER_TEMP/LiteRightReleaseDerived/Build/Products/Release/LiteRight.app"
          swift ci/verify-app-bundle.swift "$APP" release
          strings "$APP/Contents/MacOS/LiteRight" | grep -Fq 'preview_request_received'
          strings "$APP/Contents/PlugIns/LiteRightFinderExtension.appex/Contents/MacOS/LiteRightFinderExtension" | grep -Fq 'finder_action_transport preview_link'
      - name: Package ad-hoc app and verify the ZIP, DMG, checksums and signature
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/LiteRightReleaseDerived/Build/Products/Release/LiteRight.app"
          bash ci/package-release.sh "$APP" "$GITHUB_WORKSPACE/dist" v1.0.0
          bash ci/test-preview-package.sh "$GITHUB_WORKSPACE/dist" v1.0.0 release
          test -s dist/LiteRight-v1.0.0-macos-arm64-adhoc.dmg
          test -s dist/LiteRight-v1.0.0-macos-arm64-adhoc.zip
          test -s dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LiteRight-v1.0.0-macos-arm64-unnotarized
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Create annotated v1.0.0 tag and publish non-prerelease GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.0.0 -m 'LiteRight 1.0.0'
          git push origin refs/tags/v1.0.0
          gh release create v1.0.0 \
            dist/LiteRight-v1.0.0-macos-arm64-adhoc.zip \
            dist/LiteRight-v1.0.0-macos-arm64-adhoc.dmg \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'LiteRight 1.0.0 — macOS ARM64（未公证）' \
            --notes-file docs/unsigned-release.md \
            --latest
          gh release view v1.0.0 --json isDraft,isPrerelease,tagName,url
          echo 'Published v1.0.0 from main; ad-hoc signed and NOT notarized.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: LiteRight-v1.0.0-release-failure-logs
          path: |
            release-build.log
          if-no-files-found: warn
          retention-days: 14
