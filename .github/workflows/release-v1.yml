name: LiteRight community release (unnotarized)

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard tag, main ancestry and release uniqueness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: unsupported release tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          grep -Fq "MARKETING_VERSION: \"$VERSION\"" project.yml
          grep -Fq 'LITERIGHT_RELEASE_CHANNEL: preview' project.yml
          grep -Fq 'LiteRightReleaseChannel: "$(LITERIGHT_RELEASE_CHANNEL)"' project.yml
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: $TAG release already exists" >&2
            exit 1
          fi
      - name: Toolchain, real filesystem tests and generated metadata
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          brew install xcodegen
          swift test --package-path LiteRightCore
          bash ci/test-finder-sync-diagnostics.sh
          python3 -m venv .icon-venv
          .icon-venv/bin/python -m pip install --disable-pip-version-check pillow cairosvg
          .icon-venv/bin/python tools/export-icons.py
          xcodegen generate
          swift ci/verify-xcodegen-metadata.swift
      - name: Build ARM64 release with tag-matched metadata
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild -project LiteRight.xcodeproj -scheme LiteRight \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/LiteRightReleaseDerived" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION=1 \
            LITERIGHT_RELEASE_CHANNEL=release \
            OTHER_SWIFT_FLAGS="-D LITERIGHT_UNTRUSTED_PREVIEW" \
            build 2>&1 | tee release-build.log
          APP="$RUNNER_TEMP/LiteRightReleaseDerived/Build/Products/Release/LiteRight.app"
          swift ci/verify-app-bundle.swift "$APP" release
          strings "$APP/Contents/MacOS/LiteRight" | grep -Fq 'preview_request_received'
          strings "$APP/Contents/PlugIns/LiteRightFinderExtension.appex/Contents/MacOS/LiteRightFinderExtension" | grep -Fq 'finder_action_transport preview_link'
      - name: Package and verify ZIP, DMG, checksums and signature
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          APP="$RUNNER_TEMP/LiteRightReleaseDerived/Build/Products/Release/LiteRight.app"
          bash ci/package-release.sh "$APP" "$GITHUB_WORKSPACE/dist" "$TAG"
          bash ci/test-preview-package.sh "$GITHUB_WORKSPACE/dist" "$TAG" release
          test -s "dist/LiteRight-${TAG}-macos-arm64-adhoc.dmg"
          test -s "dist/LiteRight-${TAG}-macos-arm64-adhoc.zip"
          test -s dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LiteRight-${{ github.ref_name }}-macos-arm64-unnotarized
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish non-prerelease GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          NOTES="docs/unsigned-release-v${VERSION}.md"
          test -s "$NOTES"
          gh release create "$TAG" \
            "dist/LiteRight-${TAG}-macos-arm64-adhoc.zip" \
            "dist/LiteRight-${TAG}-macos-arm64-adhoc.dmg" \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "LiteRight $VERSION — macOS ARM64（未公证）" \
            --notes-file "$NOTES" \
            --latest
          gh release view "$TAG" --json isDraft,isPrerelease,tagName,url
          echo "Published $TAG from main; ad-hoc signed and NOT notarized." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: LiteRight-${{ github.ref_name }}-release-failure-logs
          path: release-build.log
          if-no-files-found: warn
          retention-days: 14
