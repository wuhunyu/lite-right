name: macOS native Swift CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
concurrency:
  group: literight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-build:
    runs-on: macos-27
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path LiteRightCore
