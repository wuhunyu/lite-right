name: LiteRight
options:
  bundleIdPrefix: com.wuhunyu
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
packages:
  LiteRightCore:
    path: LiteRightCore
targets:
  LiteRight:
    type: application
    platform: macOS
    sources:
      - path: LiteRightApp
        excludes:
          - "Resources/AppInfo.plist"
          - "LiteRight.entitlements"
    info:
      path: LiteRightApp/Resources/AppInfo.plist
    entitlements:
      path: LiteRightApp/LiteRight.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wuhunyu.literight
        INFOPLIST_KEY_CFBundleDisplayName: LiteRight
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: LiteRightCore
      - target: LiteRightFinderExtension
        embed: true
  LiteRightFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: LiteRightFinderExtension
        excludes:
          - "Info.plist"
          - "LiteRightFinderExtension.entitlements"
    info:
      path: LiteRightFinderExtension/Info.plist
    entitlements:
      path: LiteRightFinderExtension/LiteRightFinderExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wuhunyu.literight.finder
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - package: LiteRightCore
schemes:
  LiteRight:
    build:
      targets:
        LiteRight: all
        LiteRightFinderExtension: all
